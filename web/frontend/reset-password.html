<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đặt lại mật khẩu FlowMate AI</title>
    <meta name="robots" content="noindex,nofollow">
    <style>
        :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
        body { margin: 0; background: #f4fafb; color: #173042; }
        main { max-width: 440px; margin: 0 auto; padding: 48px 20px 64px; }
        article { background: white; border: 1px solid #cbe7ec; border-radius: 20px; padding: 28px; box-shadow: 0 12px 36px #164e6312; }
        h1 { margin-top: 0; font-size: 22px; }
        p { line-height: 1.6; }
        label { display: block; margin: 16px 0 6px; font-weight: 600; font-size: 13px; }
        input { width: 100%; box-sizing: border-box; padding: 11px 13px; border-radius: 10px; border: 1px solid #cbe7ec; font-size: 15px; background: #fff; color: #173042; }
        button { width: 100%; margin-top: 20px; padding: 12px 18px; border: none; border-radius: 10px; background: #0b5ed7; color: white; font-weight: 700; font-size: 15px; cursor: pointer; }
        button:disabled { opacity: 0.6; cursor: default; }
        .status { margin-top: 14px; font-size: 13.5px; line-height: 1.5; }
        .status.error { color: #c22; }
        .status.success { color: #167d4b; }
        a.button-link { display: inline-block; margin-top: 16px; padding: 11px 18px; border-radius: 10px; background: #0b5ed7; color: white; font-weight: 700; text-decoration: none; }
        @media (prefers-color-scheme: dark) {
            body { background: #071827; color: #f3fbfd; }
            article { background: #0e2335; border-color: #24485a; }
            input { background: #0e2335; border-color: #24485a; color: #f3fbfd; }
        }
    </style>
</head>
<body>
<main>
    <article>
        <div id="formStage">
            <h1>Đặt lại mật khẩu</h1>
            <p>Nhập mật khẩu mới cho tài khoản FlowMate của bạn.</p>
            <form id="resetForm">
                <label for="newPassword">Mật khẩu mới</label>
                <input id="newPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
                <label for="confirmPassword">Xác nhận mật khẩu mới</label>
                <input id="confirmPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
                <button type="submit" id="submitBtn">Đặt lại mật khẩu</button>
            </form>
            <p id="status" class="status"></p>
        </div>
        <div id="successStage" hidden>
            <h1>Đã đặt lại mật khẩu</h1>
            <p>Mật khẩu của bạn đã được cập nhật. Vui lòng đăng nhập lại bằng mật khẩu mới trên ứng dụng hoặc trang web.</p>
            <a class="button-link" href="/app">Mở FlowMate</a>
        </div>
    </article>
</main>
<script>
(function () {
    var token = new URLSearchParams(window.location.search).get('token') || '';
    var form = document.getElementById('resetForm');
    var status = document.getElementById('status');
    var submitBtn = document.getElementById('submitBtn');

    if (!token) {
        status.textContent = 'Link đặt lại mật khẩu không hợp lệ hoặc thiếu mã. Vui lòng yêu cầu lại từ màn hình đăng nhập.';
        status.className = 'status error';
        form.querySelectorAll('input, button').forEach(function (el) { el.disabled = true; });
        return;
    }

    form.addEventListener('submit', async function (event) {
        event.preventDefault();
        var password = document.getElementById('newPassword').value;
        var confirm = document.getElementById('confirmPassword').value;
        if (password.length < 8) {
            status.textContent = 'Mật khẩu phải có ít nhất 8 ký tự.';
            status.className = 'status error';
            return;
        }
        if (password !== confirm) {
            status.textContent = 'Hai mật khẩu không khớp.';
            status.className = 'status error';
            return;
        }

        submitBtn.disabled = true;
        status.textContent = 'Đang xử lý...';
        status.className = 'status';
        try {
            var response = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                body: JSON.stringify({ token: token, password: password })
            });
            var data = await response.json().catch(function () { return {}; });
            if (!response.ok || !data.success) {
                throw new Error(data.message || 'Không đặt lại được mật khẩu.');
            }
            document.getElementById('formStage').hidden = true;
            document.getElementById('successStage').hidden = false;
        } catch (error) {
            status.textContent = error.message;
            status.className = 'status error';
            submitBtn.disabled = false;
        }
    });
})();
</script>
</body>
</html>
