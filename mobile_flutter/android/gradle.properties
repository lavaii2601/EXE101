org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The project lives on D:\ while the Gradle/Kotlin caches default to C:\ --
# Kotlin's incremental compiler can't compute a relative path across drive
# letters on Windows and crashes (IllegalArgumentException: different roots).
# Incremental compilation is a build-speed optimization only; disabling it
# avoids the crash without touching where either drive's caches live.
kotlin.incremental=false

